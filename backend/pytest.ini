[pytest]
pythonpath = .
testpaths = tests
markers =
    groq: calls the real Groq API with the key in backend/.env (run with: pytest -m groq)
    slow: loads the real Kokoro model (run with: pytest -m slow)
addopts = -m "not slow and not groq"
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
