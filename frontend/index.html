<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VoxDoc reads PDF and Word documents aloud and highlights each word as it's spoken." />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)" />
    <title>VoxDoc</title>
    <script>
      // Before the first paint: the saved theme, or the system's. Same rule as
      // src/lib/theme.js, so a dark page never flashes white while React loads.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('voxdoc:theme')
        } catch (e) {}
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
